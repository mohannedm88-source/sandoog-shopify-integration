<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sandoog Integration</title>
<style>
  :root { --bg:#f5f6f8; --card:#fff; --ink:#1c2230; --mute:#6b7385; --line:#e2e5ec; --brand:#1f5eff; --ok:#12805c; --warn:#b26a00; --bad:#c0392b; }
  @media (prefers-color-scheme: dark) { :root { --bg:#12151c; --card:#1b2029; --ink:#e8ebf2; --mute:#9aa3b5; --line:#2b3240; --brand:#6d97ff; --ok:#4cc79a; --warn:#f0b24a; --bad:#ff7b6b; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:-apple-system,"Segoe UI",Tahoma,Arial,sans-serif; font-size:14px; }
  header { position:sticky; top:0; z-index:5; background:var(--card); border-bottom:1px solid var(--line); padding:12px 16px; display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
  h1 { font-size:18px; margin:0; margin-inline-end:auto; }
  .tabs { display:flex; gap:6px; flex-wrap:wrap; }
  button { font:inherit; cursor:pointer; border:1px solid var(--line); background:var(--card); color:var(--ink); border-radius:8px; padding:7px 12px; }
  button.tab.active { background:var(--brand); color:#fff; border-color:var(--brand); }
  button.send { background:var(--brand); color:#fff; border-color:var(--brand); font-weight:600; width:100%; }
  button:disabled { opacity:.5; cursor:default; }
  main { padding:16px; max-width:1500px; margin:0 auto; }
  #msg { margin-bottom:12px; }
  .banner { padding:10px 14px; border-radius:8px; border:1px solid var(--line); background:var(--card); }
  .banner.err { border-color:var(--bad); color:var(--bad); }
  .banner.okb { border-color:var(--ok); color:var(--ok); }
  .grid { display:grid; gap:12px; }
  .order { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; display:grid; grid-template-columns: 150px 1.1fr 1.4fr 1.3fr 150px; gap:14px; align-items:start; }
  .order.warn { border-color:var(--warn); }
  @media (max-width: 1000px) { .order { grid-template-columns: 1fr; } }
  .num { font-weight:700; font-size:16px; }
  .mute { color:var(--mute); font-size:12px; }
  label { display:block; font-size:12px; color:var(--mute); margin:6px 0 3px; }
  input, select, textarea { width:100%; font:inherit; color:var(--ink); background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:7px 9px; }
  textarea { resize:vertical; min-height:54px; }
  .badge { display:inline-block; padding:2px 9px; border-radius:99px; font-size:12px; border:1px solid currentColor; }
  .badge.pending { color:var(--warn); } .badge.sent { color:var(--ok); } .badge.cancelled { color:var(--mute); }
  .items div { padding:4px 0; border-bottom:1px dashed var(--line); } .items div:last-child { border:0; }
  .sku { font-family:ui-monospace,Menlo,Consolas,monospace; font-size:12px; direction:ltr; display:inline-block; }
  .guess { color:var(--warn); font-size:12px; margin-top:3px; }
  .xpanel { grid-column:1/-1; border:1px dashed var(--mute); border-radius:8px; padding:12px; margin-top:6px; }
  .xpanel .row { display:flex; gap:8px; align-items:center; margin:4px 0; flex-wrap:wrap; }
  .xpanel input[type=text], .xpanel input[type=number] { width:auto; }
  .empty { text-align:center; color:var(--mute); padding:40px 0; }
</style>
</head>
<body>
<header>
  <h1>Sandoog Integration — مراجعة الطلبات</h1>
  <div class="tabs" id="tabs"></div>
  <button id="refresh">تحديث</button>
  <button id="fulfillAll" title="يحوّل الطلبات المرسلة لصندوق والتي ما زالت Unfulfilled إلى Fulfilled">تحويل المرسَل إلى Fulfilled</button>
  <button id="regHook" title="يسجّل رابط استقبال حالات الطلبات من صندوق (مرة واحدة)">تفعيل مزامنة الحالات</button>
</header>
<main>
  <div id="msg"></div>
  <div class="grid" id="list"></div>
</main>
<script>
(function () {
  var state = { orders: [], cities: [], filter: 'pending' };
  var TABS = [['pending', 'بانتظار الإرسال'], ['sent', 'تم الإرسال'], ['all', 'الكل']];

  function el(tag, props, kids) {
    var n = document.createElement(tag);
    if (props) Object.keys(props).forEach(function (k) {
      if (k === 'class') n.className = props[k];
      else if (k === 'text') n.textContent = props[k];
      else if (k.slice(0, 2) === 'on') n.addEventListener(k.slice(2), props[k]);
      else n.setAttribute(k, props[k]);
    });
    (kids || []).forEach(function (c) { if (c) n.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
    return n;
  }
  function banner(text, kind) {
    var m = document.getElementById('msg'); m.textContent = '';
    if (text) m.appendChild(el('div', { class: 'banner ' + (kind || ''), text: text }));
  }
  function fmtDate(s) {
    try { return new Date(s).toLocaleString('ar-IQ', { dateStyle: 'medium', timeStyle: 'short' }); } catch (e) { return s; }
  }
  function renderTabs() {
    var box = document.getElementById('tabs'); box.textContent = '';
    TABS.forEach(function (t) {
      var count = state.orders.filter(function (o) { return t[0] === 'all' || o.status === t[0]; }).length;
      box.appendChild(el('button', { class: 'tab' + (state.filter === t[0] ? ' active' : ''), text: t[1] + ' (' + count + ')',
        onclick: function () { state.filter = t[0]; render(); } }));
    });
  }
  var STATUS_AR = { Requested: 'مطلوب', Placed: 'تم الاستلام', PickedUp: 'تم الاستلام من المخزن', ForPacking: 'بانتظار التعبئة', Packed: 'تمت التعبئة', OnDelivery: 'قيد التوصيل', Delivered: 'تم التسليم', Complete: 'مكتمل', ResolutionRequired: 'يحتاج معالجة', ResolutionResolved: 'تمت المعالجة', SemiDelivered: 'تسليم جزئي', SemiFailed: 'فشل جزئي', ToReturn: 'قيد الإرجاع', Returned: 'مرتجع', Failed: 'فشل التوصيل', Cancelled: 'ملغي' };
  function statusText(o) {
    if (o.status === 'pending') return 'بانتظار الإرسال';
    if (o.status === 'cancelled') return 'ملغي';
    var t = 'أُرسل';
    if (o.sandoogStatus) t += ' · ' + (STATUS_AR[o.sandoogStatus] || o.sandoogStatus);
    if (o.fulfillment === 'FULFILLED') t += ' · Fulfilled';
    else if (o.fulfillment) t += ' · غير مُنفَّذ (Unfulfilled)';
    return t;
  }
  function post(url) {
    return fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, credentials: 'same-origin', body: '{}' })
      .then(function (r) { return r.json().catch(function () { return { ok: false, error: 'HTTP ' + r.status }; }); });
  }
  function exchangePanel(o, citySel0, region0, phone0, addr0, onDone) {
    var kind = el('select', {}, [el('option', { value: 'exchange', text: 'تبديل' }), el('option', { value: 'return', text: 'استرجاع' })]);
    var back = o.items.map(function (i) {
      var cb = el('input', { type: 'checkbox' });
      var q = el('input', { type: 'number', min: '1', max: String(i.qty), value: String(i.qty), style: 'width:60px' });
      return { item: i, cb: cb, q: q, row: el('div', { class: 'row' }, [cb, el('span', { text: i.title + (i.variant ? ' — ' + i.variant : '') }), el('span', { class: 'sku', text: i.sku }), el('span', { class: 'mute', text: 'الكمية:' }), q]) };
    });
    var newBox = el('div', {});
    var newRows = [];
    function addNew() {
      var sku = el('input', { type: 'text', placeholder: 'SKU القطعة الجديدة', dir: 'ltr', style: 'width:230px' });
      var q = el('input', { type: 'number', min: '1', value: '1', style: 'width:60px' });
      var r = { sku: sku, q: q, row: el('div', { class: 'row' }, [sku, el('span', { class: 'mute', text: 'الكمية:' }), q]) };
      newRows.push(r); newBox.appendChild(r.row);
    }
    addNew();
    var addBtn = el('button', { text: '+ قطعة جديدة', onclick: function () { addNew(); } });
    var newWrap = el('div', {}, [el('label', { text: 'القطع الجديدة اللي رح تنرسل للزبون (SKU كما في صندوق)' }), newBox, addBtn]);
    var amount = el('input', { type: 'number', min: '0', value: '0', style: 'width:140px' });
    var city = el('select', {}, [el('option', { value: '', text: '— اختر المحافظة —' })]);
    state.cities.forEach(function (c) { var op = el('option', { value: c.code, text: c.label }); if (c.code === citySel0.value) op.selected = true; city.appendChild(op); });
    var region = el('select', {}, [el('option', { value: 'Center', text: 'Center (مركز)' }), el('option', { value: 'County', text: 'County (أطراف)' })]);
    region.value = region0.value;
    city.addEventListener('change', function () { region.value = city.value === 'baghdad' ? 'Center' : 'County'; });
    var phone = el('input', { type: 'text', value: phone0.value, dir: 'ltr' });
    var addr = el('textarea', {}); addr.value = addr0.value;
    var go = el('button', { class: 'send', text: 'إنشاء الطلب في صندوق' });
    var cancel = el('button', { text: 'إغلاق', onclick: function () { onDone(false); } });
    function sync() { newWrap.style.display = kind.value === 'exchange' ? '' : 'none'; }
    kind.addEventListener('change', sync); sync();
    go.addEventListener('click', function () {
      var takeBack = back.filter(function (b) { return b.cb.checked; }).map(function (b) { return { sku: b.item.sku, title: b.item.title, qty: Number(b.q.value) || 1 }; });
      var newItems = newRows.map(function (r) { return { sku: r.sku.value.trim(), qty: Number(r.q.value) || 1 }; }).filter(function (x) { return x.sku; });
      if (!takeBack.length) { banner('اختر القطع اللي رح تنستلم من الزبون', 'err'); return; }
      if (kind.value === 'exchange' && !newItems.length) { banner('أضف SKU القطعة الجديدة للتبديل', 'err'); return; }
      if (!city.value) { banner('اختر المحافظة', 'err'); return; }
      if (!window.confirm('إنشاء طلب ' + (kind.value === 'exchange' ? 'تبديل' : 'استرجاع') + ' جديد في صندوق للطلب ' + o.name + '؟\nسيُحتسب له أجور توصيل جديدة.\nالمبلغ المطلوب من الزبون: ' + (Number(amount.value) || 0))) return;
      go.disabled = true; go.textContent = 'جارٍ الإرسال...';
      fetch('/admin/api/exchange', { method: 'POST', headers: { 'Content-Type': 'application/json' }, credentials: 'same-origin',
        body: JSON.stringify({ name: o.name, kind: kind.value, takeBack: takeBack, newItems: newItems, amount: Number(amount.value) || 0, city: city.value, region: region.value, phone: phone.value, address: addr.value }) })
        .then(function (r) { return r.json().catch(function () { return { ok: false, error: 'HTTP ' + r.status }; }); })
        .then(function (d) {
          if (d.ok) { banner('تم إنشاء ' + d.ref + ' في صندوق ' + (d.sandoogId || '') + (d.warning ? ' — ' + d.warning : ''), d.warning ? 'err' : 'okb'); onDone(true); }
          else { banner('فشل: ' + d.error, 'err'); go.disabled = false; go.textContent = 'إنشاء الطلب في صندوق'; }
        })
        .catch(function (e) { banner('خطأ في الاتصال: ' + e.message, 'err'); go.disabled = false; go.textContent = 'إنشاء الطلب في صندوق'; });
    });
    return el('div', { class: 'xpanel' }, [
      el('div', { style: 'font-weight:600', text: 'تبديل / استرجاع للطلب ' + o.name + ' (طلب جديد في صندوق مع أجور توصيل جديدة)' }),
      el('label', { text: 'النوع' }), kind,
      el('label', { text: 'القطع اللي رح تنستلم من الزبون' }),
      el('div', {}, back.map(function (b) { return b.row; })),
      newWrap,
      el('label', { text: 'المبلغ المطلوب من الزبون عند الاستلام (دينار، يشمل أجور التوصيل — 0 إذا ما في)' }), amount,
      el('label', { text: 'المحافظة' }), city, el('label', { text: 'المنطقة' }), region,
      el('label', { text: 'الهاتف' }), phone, el('label', { text: 'العنوان' }), addr,
      el('div', { class: 'row', style: 'margin-top:8px' }, [go, cancel]),
    ]);
  }
  function card(o) {
    var citySel = el('select', {}, [el('option', { value: '', text: '— اختر المحافظة —' })]);
    state.cities.forEach(function (c) {
      var op = el('option', { value: c.code, text: c.label });
      if (c.code === o.cityCode) op.selected = true;
      citySel.appendChild(op);
    });
    var region = el('select', {}, [el('option', { value: 'Center', text: 'Center (مركز)' }), el('option', { value: 'County', text: 'County (أطراف)' })]);
    region.value = o.region;
    citySel.addEventListener('change', function () {
      // default region follows the governorate: Baghdad = Center, otherwise County
      region.value = citySel.value === 'baghdad' ? 'Center' : 'County';
    });
    var phone = el('input', { type: 'text', value: o.phone, dir: 'ltr' });
    var addr = el('textarea', {}); addr.value = o.address;
    var sent = o.status !== 'pending';
    [citySel, region, phone, addr].forEach(function (x) { x.disabled = sent; });
    var btn = el('button', { class: 'send', text: sent ? 'تم الإرسال' : 'إرسال إلى صندوق' });
    btn.disabled = sent;
    btn.addEventListener('click', function () {
      if (!citySel.value) { banner('اختر المحافظة للطلب ' + o.name, 'err'); citySel.focus(); return; }
      if (!window.confirm('إرسال الطلب ' + o.name + ' إلى صندوق؟\nالمحافظة: ' + citySel.options[citySel.selectedIndex].text + '\nالهاتف: ' + phone.value)) return;
      btn.disabled = true; btn.textContent = 'جارٍ الإرسال...';
      fetch('/admin/api/send', { method: 'POST', headers: { 'Content-Type': 'application/json' }, credentials: 'same-origin',
        body: JSON.stringify({ name: o.name, city: citySel.value, region: region.value, phone: phone.value, address: addr.value }) })
        .then(function (r) { return r.json().catch(function () { return { ok: false, error: 'HTTP ' + r.status }; }); })
        .then(function (d) {
          if (d.ok) { banner('تم إرسال ' + o.name + ' إلى صندوق ' + (d.sandoogId || '') + (d.warning ? ' — ' + d.warning : (d.fulfilled ? ' — وصار Fulfilled في Shopify' : '')), d.warning ? 'err' : 'okb'); load(true); }
          else { banner('فشل إرسال ' + o.name + ': ' + d.error, 'err'); btn.disabled = false; btn.textContent = 'إرسال إلى صندوق'; }
        })
        .catch(function (e) { banner('خطأ في الاتصال: ' + e.message, 'err'); btn.disabled = false; btn.textContent = 'إرسال إلى صندوق'; });
    });

    var left = el('div', {}, [
      el('div', { class: 'num', text: o.name }),
      el('div', { class: 'mute', text: fmtDate(o.createdAt) }),
      el('div', { style: 'margin-top:8px' }, [el('span', { class: 'badge ' + o.status, text: statusText(o) })]),
    ]);
    var cust = el('div', {}, [
      el('div', { text: o.customer, style: 'font-weight:600' }),
      el('label', { text: 'الهاتف' }), phone,
      el('div', { class: 'mute', style: 'margin-top:6px', text: (o.cod ? 'الدفع عند الاستلام: ' : 'مدفوع: ') + o.total + ' ' + o.currency }),
    ]);
    var loc = el('div', {}, [
      el('label', { text: 'المحافظة (صندوق)' }), citySel,
      o.cityGuess === 'guess' ? el('div', { class: 'guess', text: 'تخمين تلقائي — تأكد منه' }) : null,
      el('div', { class: 'mute', text: 'كتبها الزبون: ' + [o.city, o.province].filter(Boolean).join(' / ') }),
      el('label', { text: 'المنطقة' }), region,
      el('label', { text: 'العنوان' }), addr,
    ]);
    var items = el('div', { class: 'items' }, o.items.map(function (i) {
      return el('div', {}, [el('div', { text: i.qty + ' × ' + i.title + (i.variant ? ' — ' + i.variant : '') }), el('span', { class: 'sku', text: i.sku || '(بدون SKU)' })]);
    }));
    var btnBox = [btn];
    var holder = el('div', { style: 'grid-column:1/-1' });
    if (o.status === 'sent') {
      var xb = el('button', { text: 'تبديل / استرجاع', style: 'margin-top:6px' });
      xb.addEventListener('click', function () {
        if (holder.firstChild) { holder.textContent = ''; return; }
        holder.appendChild(exchangePanel(o, citySel, region, phone, addr, function (done) { holder.textContent = ''; if (done) load(true); }));
      });
      btnBox.push(el('br'), xb);
    }
    var wrap = el('div', { class: 'order' + (o.status === 'pending' && !o.cityCode ? ' warn' : '') }, [left, cust, loc, items, el('div', {}, btnBox)]);
    if (o.exchange && o.exchange.kinds && o.exchange.kinds.length) {
      wrap.appendChild(el('div', { class: 'mute', style: 'grid-column:1/-1', text: 'لهذا الطلب ' + o.exchange.kinds.map(function (k) { return k === 'exchange' ? 'تبديل' : 'استرجاع'; }).join(' + ') + (o.exchange.status ? ' · حالته في صندوق: ' + (STATUS_AR[o.exchange.status] || o.exchange.status) : '') }));
    }
    wrap.appendChild(holder);
    return wrap;
  }
  function render() {
    renderTabs();
    var list = document.getElementById('list'); list.textContent = '';
    var rows = state.orders.filter(function (o) { return state.filter === 'all' || o.status === state.filter; });
    if (!rows.length) { list.appendChild(el('div', { class: 'empty', text: 'لا توجد طلبات في هذا القسم' })); return; }
    rows.forEach(function (o) { list.appendChild(card(o)); });
  }
  function load(keepMsg) {
    if (!keepMsg) banner('جارٍ التحميل...');
    fetch('/admin/api/orders', { credentials: 'same-origin' })
      .then(function (r) { return r.json().catch(function () { return { ok: false, error: 'HTTP ' + r.status }; }); })
      .then(function (d) {
        if (!d.ok) { banner(d.error, 'err'); return; }
        if (!keepMsg) banner('');
        state.orders = d.orders; state.cities = d.cities; render();
      })
      .catch(function (e) { banner('خطأ في الاتصال: ' + e.message, 'err'); });
  }
  document.getElementById('refresh').addEventListener('click', function () { load(false); });
  document.getElementById('fulfillAll').addEventListener('click', function () {
    if (!window.confirm('تحويل كل الطلبات المرسلة لصندوق (والتي ما زالت Unfulfilled) إلى Fulfilled في Shopify؟ بدون إرسال إيميل للزبائن.')) return;
    banner('جارٍ التحويل...');
    post('/admin/api/fulfill-sent').then(function (d) {
      if (!d.ok) { banner('فشل: ' + d.error, 'err'); return; }
      var msg = 'تم تحويل ' + d.done.length + ' طلب إلى Fulfilled' + (d.done.length ? ': ' + d.done.join('، ') : '');
      if (d.failed.length) msg += ' — تعذر: ' + d.failed.join(' | ');
      banner(msg, d.failed.length ? 'err' : 'okb'); load(true);
    }).catch(function (e) { banner('خطأ في الاتصال: ' + e.message, 'err'); });
  });
  document.getElementById('regHook').addEventListener('click', function () {
    if (!window.confirm('تسجيل رابط استقبال حالات الطلبات من صندوق؟')) return;
    banner('جارٍ التسجيل...');
    post('/admin/api/register-webhook').then(function (d) {
      banner(d.ok ? 'تم تفعيل مزامنة الحالات من صندوق' : 'فشل التسجيل: ' + d.error, d.ok ? 'okb' : 'err');
    }).catch(function (e) { banner('خطأ في الاتصال: ' + e.message, 'err'); });
  });
  load(false);
})();
</script>
</body>
</html>
